<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Frederico Spinelli</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="components.js" defer></script>
</head>
<body>
    <div id="scroll-progress"></div>
    <site-header></site-header>

    <site-nav></site-nav>

    <main>
        <section class="blog-hero">
            <h2>Blog</h2>
            <p class="tagline">Thoughts on IT, automation, cybersecurity, and homelabbing</p>
        </section>

        <section class="posts-list" id="posts">
            <!-- Posts will be listed here dynamically -->
        </section>
    </main>

    <site-footer></site-footer>

    <script>
        // Load posts from the posts/ directory
        async function loadPosts() {
            const postsContainer = document.getElementById('posts');
            
            // Post metadata - update this when adding new posts
            const posts = [
                {
                    slug: '2025-11-29-how-i-engineered-a-mobile-asset-ecosystem',
                    title: 'How I Engineered a Mobile Asset Ecosystem',
                    date: '2025-11-29',
                    excerpt: 'Building SnipeMate + SnipeSync: A complete mobile-first logistics workflow using iPad, Jamf Pro, and Snipe-IT API.',
                    tags: ['asset-management', 'snipemate', 'jamf']
                },
                {
                    slug: '2025-07-10-how-i-automated-our-inventory-audits',
                    title: 'How I Automated Our Inventory Audits in My First 3 Months of Apprenticeship',
                    date: '2025-07-10',
                    excerpt: 'Building SnipeSync - bridging QR scanner data with Snipe-IT API to automate inventory audits from multi-hour Excel process to one-click workflow.',
                    tags: ['automation', 'snipe-it', 'python']
                },
                {
                    slug: '2025-06-26-easiest-nas-build-yet',
                    title: 'Easiest NAS Build Yet',
                    date: '2025-06-26',
                    excerpt: 'Building a budget NAS with an old laptop and CasaOS for a friend\'s music collection.',
                    tags: ['homelab', 'DIY', 'storage']
                },
                {
                    slug: '2025-04-29-osint-case-study-far-right-telegram-fne',
                    title: 'OSINT Case Study: Far-Right French Political Influence on Telegram',
                    date: '2025-04-29',
                    excerpt: 'How Telegram Became a Strategic Hub for Far-Right Mobilization in France Ahead of the 2027 Elections.',
                    tags: ['OSINT', 'investigation', 'telegram']
                },
                {
                    slug: '2025-04-24-in-search-of-signals',
                    title: 'In Search of Signals',
                    date: '2025-04-24',
                    excerpt: "This isn't just a tech stack. This is about chasing signals, asking questions, and understanding the systems that shape our lives.",
                    tags: ['intro', 'personal', 'tracewire']
                },
                {
                    slug: '2026-05-19-welcome-to-my-blog',
                    title: 'Welcome to My Blog',
                    date: '2026-05-19',
                    excerpt: 'Moving away from Substack to host my own content. Here I\'ll share thoughts on IT, automation, homelab projects, and more.',
                    tags: ['intro', 'personal']
                }
            ];

            if (posts.length === 0) {
                postsContainer.innerHTML = '<p class="no-posts">No posts yet. Check back soon!</p>';
                return;
            }

            postsContainer.innerHTML = posts.map(post => `
                <article class="post-card">
                    <div class="post-meta">
                        <span class="post-date">${formatDate(post.date)}</span>
                        <span class="post-tags">${post.tags.map(t => `<span class="tag">${t}</span>`).join('')}</span>
                    </div>
                    <h3 class="post-title"><a href="posts/${post.slug}.html">${post.title}</a></h3>
                    <p class="post-excerpt">${post.excerpt}</p>
                    <a href="posts/${post.slug}.html" class="read-more">Read more →</a>
                </article>
            `).join('');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('fr-FR', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            });
        }

        loadPosts();
    </script>
</body>
</html>
